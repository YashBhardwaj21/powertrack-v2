<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>PowerTrack - West Java Solar Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS for the map component -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>
  <div id="debug-overlay"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;"></div>

  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      const overlay = document.getElementById('debug-overlay');
      const errDiv = document.createElement('div');
      errDiv.style.backgroundColor = 'rgba(255, 0, 0, 0.9)';
      errDiv.style.color = 'white';
      errDiv.style.padding = '20px';
      errDiv.style.margin = '10px';
      errDiv.style.borderRadius = '8px';
      errDiv.style.pointerEvents = 'auto';
      errDiv.style.fontFamily = 'monospace';
      errDiv.innerHTML = `<strong>Runtime Error:</strong><br>${message}<br><small>${source}:${lineno}:${colno}</small>`;
      overlay.appendChild(errDiv);
      console.error('Captured Error:', error);
    };

    window.onunhandledrejection = function (event) {
      const overlay = document.getElementById('debug-overlay');
      const errDiv = document.createElement('div');
      errDiv.style.backgroundColor = 'rgba(255, 165, 0, 0.9)';
      errDiv.style.color = 'black';
      errDiv.style.padding = '20px';
      errDiv.style.margin = '10px';
      errDiv.style.borderRadius = '8px';
      errDiv.style.pointerEvents = 'auto';
      errDiv.style.fontFamily = 'monospace';
      errDiv.innerHTML = `<strong>Promise Rejection:</strong><br>${event.reason}`;
      overlay.appendChild(errDiv);
    };
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
